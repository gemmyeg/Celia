
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QS Submittals - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Karla', system-ui, sans-serif;
      background: oklch(0.95 0.012 55);
      color: oklch(0.30 0.01 50);
    }
    .page { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 50px 20px; }
    .card {
      width: 100%; max-width: 440px;
      background: oklch(0.95 0.012 55);
      border-radius: 32px;
      padding: 46px;
      box-shadow: 16px 16px 34px oklch(0.72 0.02 50 / .42), -16px -16px 34px oklch(1 0 0 / .9);
    }
    .login-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: oklch(0.95 0.012 55);
      color: oklch(0.42 0.13 18);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 22px;
      box-shadow: 6px 6px 14px oklch(0.72 0.02 50 / .38), -6px -6px 14px oklch(1 0 0 / .9);
    }
    .login-icon svg { width: 26px; height: 26px; }
    .header { margin-bottom: 30px; text-align: center; }
    .header h1 { font-family: 'Quicksand', sans-serif; margin: 0 0 8px; font-size: 26px; line-height: 1.2; font-weight: 700; color: oklch(0.24 0.02 40); }
    .header p { margin: 0; font-size: 14px; line-height: 1.6; color: oklch(0.48 0.012 50); }
    .login-field { margin-bottom: 20px; }
    .login-field label { display: block; margin-bottom: 10px; font-size: 12.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: oklch(0.4 0.015 50); }
    .login-input-wrap { position: relative; }
    .login-input {
      width: 100%; height: 54px;
      padding: 0 20px;
      border: none; border-radius: 18px;
      background: oklch(0.95 0.012 55);
      box-shadow: inset 5px 5px 12px oklch(0.72 0.02 50 / .35), inset -5px -5px 12px oklch(1 0 0 / .85);
      color: oklch(0.3 0.02 40);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: box-shadow .2s ease;
    }
    .login-input.has-toggle { padding-right: 52px; }
    .login-input:focus { box-shadow: inset 5px 5px 12px oklch(0.42 0.13 18 / .22), inset -5px -5px 12px oklch(1 0 0 / .85); }
    .login-input.invalid { box-shadow: inset 4px 4px 9px oklch(0.55 0.19 25 / .35), inset -4px -4px 9px oklch(1 0 0 / .7), 0 0 0 2px oklch(0.55 0.19 25 / .35); }
    .password-toggle {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 38px; height: 38px;
      border: none; border-radius: 12px;
      background: transparent;
      color: oklch(0.5 0.012 50);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s ease, color .15s ease;
    }
    .password-toggle:hover { background: oklch(0.90 0.02 50 / .5); color: oklch(0.42 0.13 18); }
    .password-toggle svg { width: 19px; height: 19px; }
    .login-button {
      width: 100%; height: 56px;
      margin-top: 8px;
      border: none; border-radius: 18px;
      background: oklch(0.42 0.13 18); color: oklch(0.98 0.01 40);
      font-family: 'Quicksand', sans-serif; font-size: 15px; font-weight: 700;
      cursor: pointer;
      box-shadow: 7px 7px 16px oklch(0.72 0.02 50 / .42), -7px -7px 16px oklch(1 0 0 / .85);
      transition: box-shadow .16s ease, transform .16s ease, background .16s ease, opacity .2s ease;
    }
    .login-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 9px 9px 20px oklch(0.72 0.02 50 / .48), -9px -9px 20px oklch(1 0 0 / .9); background: oklch(0.36 0.13 18); }
    .login-button:active:not(:disabled) { transform: translateY(0); box-shadow: inset 5px 5px 12px oklch(0.25 0.1 18 / .55), inset -5px -5px 12px oklch(0.55 0.16 22 / .3); background: oklch(0.34 0.13 18); }
    .login-button:disabled { opacity: .55; cursor: not-allowed; }
    .login-footnote { margin-top: 22px; text-align: center; font-size: 12px; color: oklch(0.58 0.012 50); line-height: 1.6; }

    /* ===================== Error Modal (Pop-up) — same component as index.html ===================== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: oklch(0.25 0.02 40 / .45);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; z-index: 1000;
      opacity: 0; pointer-events: none;
      transition: opacity .18s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-box {
      width: 100%; max-width: 440px;
      background: oklch(0.95 0.012 55);
      border-radius: 28px;
      padding: 34px;
      box-shadow: 20px 20px 50px oklch(0.2 0.02 40 / .35), -10px -10px 30px oklch(1 0 0 / .5);
      position: relative;
      transform: translateY(10px) scale(.97);
      transition: transform .18s ease;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }
    .modal-overlay.open .modal-box { transform: translateY(0) scale(1); }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 36px; height: 36px;
      border: none; background: oklch(0.95 0.012 55);
      color: oklch(0.5 0.012 50);
      border-radius: 12px; font-size: 18px; line-height: 1; cursor: pointer;
      box-shadow: 3px 3px 8px oklch(0.72 0.02 50 / .35), -3px -3px 8px oklch(1 0 0 / .85);
      transition: box-shadow .16s ease, color .16s ease;
    }
    .modal-close:hover { color: oklch(0.42 0.13 18); box-shadow: inset 2px 2px 6px oklch(0.72 0.02 50 / .35), inset -2px -2px 6px oklch(1 0 0 / .7); }
    .modal-icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: oklch(0.95 0.012 55);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 700; margin-bottom: 18px;
      box-shadow: 5px 5px 12px oklch(0.72 0.02 50 / .35), -5px -5px 12px oklch(1 0 0 / .85);
    }
    .error-modal-icon { color: oklch(0.5 0.19 25); }
    .modal-title { margin: 0 0 6px; font-family: 'Quicksand', sans-serif; font-size: 20px; font-weight: 700; color: oklch(0.24 0.02 40); }
    .error-modal-message { margin: 0; font-size: 14.5px; color: oklch(0.3 0.02 40); line-height: 1.6; }
    .modal-ok-button {
      width: 100%; height: 52px; margin-top: 26px;
      border: none; border-radius: 16px;
      background: oklch(0.42 0.13 18); color: oklch(0.98 0.01 40);
      font-family: 'Quicksand', sans-serif; font-size: 15px; font-weight: 700;
      cursor: pointer;
      box-shadow: 6px 6px 14px oklch(0.72 0.02 50 / .4), -6px -6px 14px oklch(1 0 0 / .85);
      transition: box-shadow .16s ease, transform .16s ease, background .16s ease;
    }
    .modal-ok-button:hover { transform: translateY(-2px); background: oklch(0.36 0.13 18); box-shadow: 8px 8px 18px oklch(0.72 0.02 50 / .45), -8px -8px 18px oklch(1 0 0 / .9); }
    .modal-ok-button:active { transform: translateY(0); box-shadow: inset 4px 4px 10px oklch(0.25 0.1 18 / .5), inset -4px -4px 10px oklch(0.55 0.16 22 / .3); }
    @media (max-width: 600px) {
      .page { padding: 24px 14px; }
      .card { padding: 32px 24px; border-radius: 24px; }
      .modal-box { padding: 26px 20px; }
    }
    /* =================================================================== */
  </style>
</head>
<body>
  <div class="page">
    <section class="card">
      <div class="login-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="header">
        <h1>QS Submittals</h1>
        <p>Sign in with your Username and Password to continue.</p>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="login-field">
          <label for="loginUsername">Username</label>
          <div class="login-input-wrap">
            <input type="text" id="loginUsername" class="login-input" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="e.g. Ismail">
          </div>
        </div>
        <div class="login-field">
          <label for="loginPassword">Password</label>
          <div class="login-input-wrap">
            <input type="password" id="loginPassword" class="login-input has-toggle" autocomplete="current-password" placeholder="Enter your password">
            <button type="button" id="togglePasswordButton" class="password-toggle" aria-label="Show password" tabindex="-1">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" id="loginButton" class="login-button">Sign In</button>
      </form>

      <p class="login-footnote">Your password is never sent in plain text — this page only ever transmits a one-time, non-reversible hash of it.</p>
    </section>
  </div>

  <div id="errorModalOverlay" class="modal-overlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="errorModalTitle">
      <button type="button" id="errorModalCloseButton" class="modal-close" aria-label="Close">&times;</button>
      <div class="modal-icon error-modal-icon">&#33;</div>
      <h3 id="errorModalTitle" class="modal-title">Error</h3>
      <p id="errorModalMessage" class="error-modal-message"></p>
      <button type="button" id="errorModalOkButton" class="modal-ok-button">OK</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwImmpgSw7Za4Z_8mUyQnGFI7EB38XFZhTOt-eeYOfKr19Zz-YIJNod3yeg2iWW-O245A/exec';
    const SESSION_STORAGE_KEY = 'qsSubmittalsSession';

    document.addEventListener('DOMContentLoaded', initialize);

    function initialize() {
      setupErrorModal();
      setupLoginForm();

      // Already have a session token from an earlier login in this tab?
      // Try going straight to index.html — it re-validates the token with
      // the server itself before showing anything, so a stale/expired
      // token just bounces back here once.
      const existing = getStoredSession();
      if (existing && existing.token) {
        window.location.href = 'index.html';
      }
    }

    function setupLoginForm() {
      document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();
        handleLogin();
      });
      document.getElementById('togglePasswordButton').addEventListener('click', togglePasswordVisibility);
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('loginPassword');
      const button = document.getElementById('togglePasswordButton');
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      button.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    }

    async function handleLogin() {
      hideError();
      const usernameInput = document.getElementById('loginUsername');
      const passwordInput = document.getElementById('loginPassword');
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      usernameInput.classList.remove('invalid');
      passwordInput.classList.remove('invalid');

      if (!username || !password) {
        if (!username) usernameInput.classList.add('invalid');
        if (!password) passwordInput.classList.add('invalid');
        showError('Please enter both a Username and Password.');
        return;
      }

      if (!window.crypto || !window.crypto.subtle) {
        showError('This browser cannot hash the password securely (Web Crypto is unavailable). Please open this page over HTTPS in an up-to-date browser.');
        return;
      }

      setLoginLoading(true);
      try {
        const nonceResponse = await callApi('getLoginNonce', {});
        if (!nonceResponse || !nonceResponse.success || !nonceResponse.nonce) {
          throw new Error((nonceResponse && nonceResponse.error) || 'Unable to start a secure login. Please try again.');
        }

        const passwordHash = await sha256Hex(password);
        const challengeHash = await sha256Hex(nonceResponse.nonce + ':' + passwordHash);

        const loginResponse = await callApi('login', { username: username, nonce: nonceResponse.nonce, hash: challengeHash });
        if (!loginResponse || !loginResponse.success || !loginResponse.token) {
          usernameInput.classList.add('invalid');
          passwordInput.classList.add('invalid');
          throw new Error((loginResponse && loginResponse.error) || 'Invalid username or password.');
        }

        storeSession({ token: loginResponse.token, username: loginResponse.username });
        window.location.href = 'index.html';
      } catch (error) {
        showError(error && error.message ? error.message : 'Unable to sign in. Please try again.');
      } finally {
        setLoginLoading(false);
      }
    }

    function setLoginLoading(loading) {
      const button = document.getElementById('loginButton');
      button.disabled = loading;
      button.textContent = loading ? 'Signing in...' : 'Sign In';
    }

    async function sha256Hex(text) {
      const encoded = new TextEncoder().encode(text);
      const digest = await crypto.subtle.digest('SHA-256', encoded);
      return Array.from(new Uint8Array(digest)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
    }

    function callApi(action, params) {
      return new Promise(function(resolve, reject) {
        const callbackName = 'handleAuthApi_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        window[callbackName] = function(response) {
          cleanupJsonp(script, callbackName);
          resolve(response);
        };
        let url = API_URL + '?action=' + encodeURIComponent(action) + '&prefix=' + encodeURIComponent(callbackName);
        Object.keys(params || {}).forEach(function(key) {
          url += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
        });
        const script = document.createElement('script');
        script.src = url;
        script.onerror = function() {
          cleanupJsonp(script, callbackName);
          reject(new Error('Unable to connect to the Google Apps Script API.'));
        };
        document.body.appendChild(script);
      });
    }

    function cleanupJsonp(script, callbackName) {
      delete window[callbackName];
      if (script && script.parentNode) script.parentNode.removeChild(script);
    }

    function storeSession(session) {
      try { sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session)); } catch (storageError) {}
    }

    function getStoredSession() {
      try {
        const raw = sessionStorage.getItem(SESSION_STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (storageError) {
        return null;
      }
    }

    function setupErrorModal() {
      const overlay = document.getElementById('errorModalOverlay');
      document.getElementById('errorModalCloseButton').addEventListener('click', hideError);
      document.getElementById('errorModalOkButton').addEventListener('click', hideError);
      overlay.addEventListener('click', function(event) {
        if (event.target === overlay) hideError();
      });
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape' && overlay.classList.contains('open')) hideError();
      });
    }

    function showError(message) {
      const overlay = document.getElementById('errorModalOverlay');
      document.getElementById('errorModalMessage').textContent = message;
      overlay.hidden = false;
      requestAnimationFrame(function() { overlay.classList.add('open'); });
    }

    function hideError() {
      const overlay = document.getElementById('errorModalOverlay');
      if (overlay.hidden) return;
      overlay.classList.remove('open');
      setTimeout(function() { overlay.hidden = true; }, 180);
    }
  </script>
</body>
</html>
