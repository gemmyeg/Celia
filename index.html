<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Item Selection</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
    }


    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f7fb;

      color: #1f2937;
    }


    .page {

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      padding: 50px 20px;
    }


    .card {

      width: 100%;

      max-width: 780px;

      background: #ffffff;

      border-radius: 18px;

      padding: 40px;

      box-shadow:
        0 10px 35px
        rgba(0, 0, 0, 0.08);
    }


    .header {

      margin-bottom: 30px;
    }


    .header h1 {

      margin: 0 0 8px 0;

      font-size: 32px;

      line-height: 1.2;

      color: #111827;
    }


    .header p {

      margin: 0;

      font-size: 16px;

      line-height: 1.6;

      color: #64748b;
    }


    /*
     * ==========================================
     * LOADING AREA
     * ==========================================
     */

    .loading {

      margin-bottom: 30px;

      padding: 16px 18px;

      border-radius: 10px;

      background:
        #f8fafc;

      border:
        1px solid
        #eef2f7;
    }


    .loading-header {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 10px;
    }


    .loading-left {

      display: flex;

      align-items: center;

      gap: 10px;

      color:
        #475569;

      font-size: 14px;
    }


    .loading-percentage {

      font-size: 14px;

      font-weight: 700;

      color:
        #2563eb;

      min-width: 42px;

      text-align: right;
    }


    /*
     * Spinner
     */

    .spinner {

      width: 18px;

      height: 18px;

      border:
        2px solid
        #e2e8f0;

      border-top-color:
        #2563eb;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    /*
     * Progress bar
     */

    .progress-track {

      width: 100%;

      height: 8px;

      overflow: hidden;

      border-radius: 999px;

      background:
        #e2e8f0;
    }


    .progress-bar {

      width: 0%;

      height: 100%;

      border-radius: 999px;

      background:
        #2563eb;

      transition:
        width 0.25s ease;
    }


    /*
     * ==========================================
     * FORM
     * ==========================================
     */

    .field {

      margin-bottom: 26px;
    }


    .field label {

      display: block;

      margin-bottom: 9px;

      font-size: 15px;

      font-weight: 700;

      color:
        #1e293b;
    }


    select {

      width: 100%;

      height: 54px;

      padding:
        0 15px;

      border:
        1px solid
        #d8dee8;

      border-radius: 10px;

      background:
        #ffffff;

      color:
        #111827;

      font-size: 16px;

      outline: none;

      cursor: pointer;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    select:hover:not(:disabled) {

      border-color:
        #aab4c3;
    }


    select:focus {

      border-color:
        #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.12);
    }


    select:disabled {

      background:
        #f8fafc;

      color:
        #aeb8c7;

      cursor:
        not-allowed;
    }


    /*
     * ==========================================
     * ERROR MESSAGE
     * ==========================================
     */

    .message {

      margin-bottom: 24px;

      padding:
        13px 15px;

      border-radius: 9px;

      font-size: 14px;

      line-height: 1.5;
    }


    .message.error {

      background:
        #fef2f2;

      color:
        #b91c1c;

      border:
        1px solid
        #fecaca;
    }


    /*
     * ==========================================
     * SELECTION RESULT
     * ==========================================
     */

    .selection-result {

      margin-top: 30px;

      padding: 20px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 10px;

      background:
        #f8fafc;
    }


    .result-row {

      display: flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      gap: 20px;

      padding:
        10px 0;
    }


    .result-row + .result-row {

      border-top:
        1px solid
        #e2e8f0;
    }


    .result-label {

      font-weight: 700;

      color:
        #334155;
    }


    .result-value {

      text-align:
        right;

      color:
        #0f172a;

      word-break:
        break-word;
    }


    /*
     * ==========================================
     * RESPONSIVE
     * ==========================================
     */

    @media (
      max-width: 600px
    ) {

      .page {

        padding:
          20px 14px;

      }


      .card {

        padding:
          25px 20px;

        border-radius:
          13px;

      }


      .header h1 {

        font-size:
          26px;

      }


      .header p {

        font-size:
          14px;

      }


      .result-row {

        flex-direction:
          column;

        gap:
          4px;

      }


      .result-value {

        text-align:
          left;

      }

    }

  </style>

</head>


<body>


  <main class="page">


    <section class="card">


      <div class="header">

        <h1>
          Item Selection
        </h1>

        <p>
          Select an Item Name to load its related Part Numbers.
        </p>

      </div>


      <!-- ==========================================
           LOADING
           ========================================== -->

      <div
        id="loading"
        class="loading"
      >

        <div class="loading-header">

          <div class="loading-left">

            <div
              id="spinner"
              class="spinner"
            ></div>

            <span id="loadingText">
              Loading database...
            </span>

          </div>


          <div
            id="loadingPercentage"
            class="loading-percentage"
          >
            0%
          </div>

        </div>


        <div class="progress-track">

          <div
            id="progressBar"
            class="progress-bar"
          ></div>

        </div>

      </div>


      <!-- ==========================================
           ERROR
           ========================================== -->

      <div
        id="errorMessage"
        class="message error"
        hidden
      >
      </div>


      <!-- ==========================================
           ITEM NAME
           ========================================== -->

      <div class="field">

        <label
          for="itemName"
        >
          Item Name
        </label>


        <select
          id="itemName"
          disabled
        >

          <option value="">
            Select Item Name
          </option>

        </select>

      </div>


      <!-- ==========================================
           PART NUMBER
           ========================================== -->

      <div class="field">

        <label
          for="partNumber"
        >
          Part Number
        </label>


        <select
          id="partNumber"
          disabled
        >

          <option value="">
            Select Part Number
          </option>

        </select>

      </div>


      <!-- ==========================================
           SELECTION RESULT
           ========================================== -->

      <div
        id="selectionResult"
        class="selection-result"
        hidden
      >

        <div class="result-row">

          <span class="result-label">
            Item Name
          </span>

          <span
            id="selectedItemName"
            class="result-value"
          >
          </span>

        </div>


        <div class="result-row">

          <span class="result-label">
            Part Number
          </span>

          <span
            id="selectedPartNumber"
            class="result-value"
          >
          </span>

        </div>

      </div>


    </section>


  </main>


  <script>


    /*
     * =========================================================
     * GOOGLE APPS SCRIPT API URL
     * =========================================================
     *
     * API URL is kept directly inside index.html.
     */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbxi2ConUAYZPrbN0e3Z9425wJKfQvPVcU8tnvM1SdDE4SNCprmieBs0l-NxsCBwpK_Msw/exec';


    /*
     * =========================================================
     * APPLICATION DATA
     * =========================================================
     */

    let databaseData = {

      itemNames: [],

      dependentPartNumbers: {}

    };


    /*
     * =========================================================
     * PROGRESS
     * =========================================================
     */

    let progressValue = 0;

    let progressTimer = null;


    /*
     * =========================================================
     * INITIALIZATION
     * =========================================================
     */

    document.addEventListener(
      'DOMContentLoaded',
      function() {

        initialize();

      }
    );


    /*
     * =========================================================
     * INITIALIZE
     * =========================================================
     */

    function initialize() {

      showLoading(true);

      hideError();

      hideSelectionResult();

      startProgress();

      loadDatabaseData();

    }


    /*
     * =========================================================
     * START PROGRESS
     *
     * The browser cannot know the real server-side percentage,
     * so the progress gradually moves toward 90% while waiting
     * for the API response.
     * =========================================================
     */

    function startProgress() {

      progressValue = 0;

      updateProgress(
        progressValue
      );


      if (progressTimer) {

        clearInterval(
          progressTimer
        );

      }


      progressTimer =
        setInterval(
          function() {

            /*
             * Slow down as we approach 90%.
             */

            if (
              progressValue < 60
            ) {

              progressValue += 2;

            } else if (
              progressValue < 80
            ) {

              progressValue += 1;

            } else if (
              progressValue < 90
            ) {

              progressValue += 0.5;

            }


            if (
              progressValue > 90
            ) {

              progressValue = 90;

            }


            updateProgress(
              progressValue
            );

          },
          150
        );

    }


    /*
     * =========================================================
     * COMPLETE PROGRESS
     * =========================================================
     */

    function completeProgress() {

      if (progressTimer) {

        clearInterval(
          progressTimer
        );

        progressTimer =
          null;

      }


      progressValue = 100;

      updateProgress(
        progressValue
      );

    }


    /*
     * =========================================================
     * UPDATE PROGRESS UI
     * =========================================================
     */

    function updateProgress(
      value
    ) {

      const percentage =
        Math.round(
          value
        );


      document.getElementById(
        'progressBar'
      ).style.width =
        percentage + '%';


      document.getElementById(
        'loadingPercentage'
      ).textContent =
        percentage + '%';

    }


    /*
     * =========================================================
     * LOAD DATABASE DATA
     *
     * JSONP is used because the GitHub Pages domain and
     * Google Apps Script domain are different.
     * =========================================================
     */

    function loadDatabaseData() {


      /*
       * Create unique callback name.
       */

      const callbackName =
        'handleDatabaseResponse_' +
        Date.now();


      /*
       * Create global callback.
       */

      window[callbackName] =
        function(response) {

          try {

            if (
              !response ||
              !response.success
            ) {

              throw new Error(
                response &&
                response.error
                  ? response.error
                  : 'The API returned an error.'
              );

            }


            databaseData =
              response.data || {

                itemNames: [],

                dependentPartNumbers: {}

              };


            /*
             * Populate Item Name dropdown.
             */

            populateItemNames();


            /*
             * Complete progress.
             */

            completeProgress();


            /*
             * Update loading text.
             */

            document.getElementById(
              'loadingText'
            ).textContent =
              'Database loaded successfully.';


          } catch (error) {

            completeProgress();


            showError(
              error &&
              error.message
                ? error.message
                : 'Unable to load database data.'
            );

          } finally {

            /*
             * Hide loading after a short delay
             * so the user can see 100%.
             */

            setTimeout(
              function() {

                showLoading(false);

              },
              400
            );


            cleanupJsonp(
              script,
              callbackName
            );

          }

        };


      /*
       * Create script element.
       */

      const script =
        document.createElement(
          'script'
        );


      /*
       * Build JSONP URL.
       */

      script.src =
        API_URL +
        '?action=getDatabaseData' +
        '&prefix=' +
        encodeURIComponent(
          callbackName
        );


      /*
       * API/network error.
       */

      script.onerror =
        function() {

          if (progressTimer) {

            clearInterval(
              progressTimer
            );

            progressTimer =
              null;

          }


          showLoading(false);


          showError(
            'Unable to connect to the Google Apps Script API.'
          );


          cleanupJsonp(
            script,
            callbackName
          );

        };


      /*
       * Add script to document.
       */

      document.body.appendChild(
        script
      );

    }


    /*
     * =========================================================
     * CLEAN JSONP
     * =========================================================
     */

    function cleanupJsonp(
      script,
      callbackName
    ) {

      if (
        script &&
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }


      try {

        delete window[
          callbackName
        ];

      } catch (error) {

        window[
          callbackName
        ] =
          undefined;

      }

    }


    /*
     * =========================================================
     * POPULATE ITEM NAME
     * =========================================================
     */

    function populateItemNames() {

      const itemNameSelect =
        document.getElementById(
          'itemName'
        );


      const partNumberSelect =
        document.getElementById(
          'partNumber'
        );


      clearSelect(
        itemNameSelect,
        'Select Item Name'
      );


      clearSelect(
        partNumberSelect,
        'Select Part Number'
      );


      const itemNames =
        databaseData.itemNames || [];


      itemNames.forEach(
        function(itemName) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            itemName;


          option.textContent =
            itemName;


          itemNameSelect.appendChild(
            option
          );

        }
      );


      itemNameSelect.disabled =
        itemNames.length === 0;


      partNumberSelect.disabled =
        true;


      itemNameSelect.onchange =
        handleItemNameChange;


      partNumberSelect.onchange =
        handlePartNumberChange;

    }


    /*
     * =========================================================
     * ITEM NAME CHANGE
     *
     * Item Name
     *      ↓
     * Part Number
     * =========================================================
     */

    function handleItemNameChange() {

      const itemNameSelect =
        document.getElementById(
          'itemName'
        );


      const partNumberSelect =
        document.getElementById(
          'partNumber'
        );


      const selectedItemName =
        itemNameSelect.value;


      clearSelect(
        partNumberSelect,
        'Select Part Number'
      );


      hideSelectionResult();


      if (
        !selectedItemName
      ) {

        partNumberSelect.disabled =
          true;

        return;

      }


      const partNumbers =
        databaseData
          .dependentPartNumbers[
            selectedItemName
          ] || [];


      partNumbers.forEach(
        function(partNumber) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            partNumber;


          option.textContent =
            partNumber;


          partNumberSelect.appendChild(
            option
          );

        }
      );


      partNumberSelect.disabled =
        partNumbers.length === 0;

    }


    /*
     * =========================================================
     * PART NUMBER CHANGE
     * =========================================================
     */

    function handlePartNumberChange() {

      const itemNameSelect =
        document.getElementById(
          'itemName'
        );


      const partNumberSelect =
        document.getElementById(
          'partNumber'
        );


      const selectedItemName =
        itemNameSelect.value;


      const selectedPartNumber =
        partNumberSelect.value;


      if (
        !selectedItemName ||
        !selectedPartNumber
      ) {

        hideSelectionResult();

        return;

      }


      document.getElementById(
        'selectedItemName'
      ).textContent =
        selectedItemName;


      document.getElementById(
        'selectedPartNumber'
      ).textContent =
        selectedPartNumber;


      document.getElementById(
        'selectionResult'
      ).hidden =
        false;

    }


    /*
     * =========================================================
     * CLEAR SELECT
     * =========================================================
     */

    function clearSelect(
      selectElement,
      placeholder
    ) {

      selectElement.innerHTML =
        '';


      const option =
        document.createElement(
          'option'
        );


      option.value =
        '';


      option.textContent =
        placeholder;


      selectElement.appendChild(
        option
      );

    }


    /*
     * =========================================================
     * SHOW / HIDE LOADING
     * =========================================================
     */

    function showLoading(
      show
    ) {

      document.getElementById(
        'loading'
      ).hidden =
        !show;

    }


    /*
     * =========================================================
     * ERROR
     * =========================================================
     */

    function showError(
      message
    ) {

      const errorElement =
        document.getElementById(
          'errorMessage'
        );


      errorElement.textContent =
        message;


      errorElement.hidden =
        false;

    }


    /*
     * =========================================================
     * HIDE ERROR
     * =========================================================
     */

    function hideError() {

      const errorElement =
        document.getElementById(
          'errorMessage'
        );


      errorElement.textContent =
        '';


      errorElement.hidden =
        true;

    }


    /*
     * =========================================================
     * HIDE RESULT
     * =========================================================
     */

    function hideSelectionResult() {

      document.getElementById(
        'selectionResult'
      ).hidden =
        true;

    }


  </script>


</body>

</html>
