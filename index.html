<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QS Submittals</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
    }


    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f5f7fb;

      color:
        #1f2937;
    }


    .page {

      min-height: 100vh;

      display: flex;

      justify-content:
        center;

      align-items:
        flex-start;

      padding:
        50px 20px;
    }


    .card {

      width: 100%;

      max-width:
        780px;

      background:
        #ffffff;

      border-radius:
        18px;

      padding:
        40px;

      box-shadow:
        0 10px 35px
        rgba(0, 0, 0, 0.08);
    }


    /*
     * ==========================================
     * HEADER
     * ==========================================
     */

    .header {

      margin-bottom:
        30px;
    }


    .header h1 {

      margin:
        0 0 8px 0;

      font-size:
        32px;

      line-height:
        1.2;

      color:
        #111827;
    }


    .header p {

      margin:
        0;

      font-size:
        16px;

      line-height:
        1.6;

      color:
        #64748b;
    }


    /*
     * ==========================================
     * SUBMITTAL TYPES
     * ==========================================
     */

    .type-section {

      margin-bottom:
        30px;
    }


    .section-label {

      display:
        block;

      margin-bottom:
        12px;

      font-size:
        15px;

      font-weight:
        700;

      color:
        #1e293b;
    }


    .type-options {

      display:
        grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap:
        10px;
    }


    .type-option {

      position:
        relative;
    }


    .type-checkbox {

      position:
        absolute;

      opacity:
        0;

      pointer-events:
        none;
    }


    .type-label {

      min-height:
        50px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        10px;

      border:
        1px solid
        #d8dee8;

      border-radius:
        10px;

      background:
        #ffffff;

      color:
        #334155;

      font-size:
        14px;

      font-weight:
        700;

      cursor:
        pointer;

      user-select:
        none;

      transition:
        all 0.2s ease;
    }


    .type-label:hover {

      border-color:
        #94a3b8;

      background:
        #f8fafc;
    }


    .type-checkbox:checked
    + .type-label {

      border-color:
        #2563eb;

      background:
        #eff6ff;

      color:
        #1d4ed8;

      box-shadow:
        0 0 0 2px
        rgba(37, 99, 235, 0.08);
    }


    /*
     * ==========================================
     * LOADING
     * ==========================================
     */

    .loading {

      margin-bottom:
        30px;

      padding:
        16px 18px;

      border-radius:
        10px;

      background:
        #f8fafc;

      border:
        1px solid
        #eef2f7;
    }


    .loading-header {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        15px;

      margin-bottom:
        10px;
    }


    .loading-left {

      display:
        flex;

      align-items:
        center;

      gap:
        10px;

      color:
        #475569;

      font-size:
        14px;
    }


    .loading-percentage {

      font-size:
        14px;

      font-weight:
        700;

      color:
        #2563eb;

      min-width:
        42px;

      text-align:
        right;
    }


    .spinner {

      width:
        18px;

      height:
        18px;

      border:
        2px solid
        #e2e8f0;

      border-top-color:
        #2563eb;

      border-radius:
        50%;

      animation:
        spin 0.8s linear infinite;
    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    .progress-track {

      width:
        100%;

      height:
        8px;

      overflow:
        hidden;

      border-radius:
        999px;

      background:
        #e2e8f0;
    }


    .progress-bar {

      width:
        0%;

      height:
        100%;

      border-radius:
        999px;

      background:
        #2563eb;

      transition:
        width 0.25s ease;
    }


    /*
     * ==========================================
     * FORM
     * ==========================================
     */

    .field {

      margin-bottom:
        26px;
    }


    .field label {

      display:
        block;

      margin-bottom:
        9px;

      font-size:
        15px;

      font-weight:
        700;

      color:
        #1e293b;
    }


    select {

      width:
        100%;

      height:
        54px;

      padding:
        0 15px;

      border:
        1px solid
        #d8dee8;

      border-radius:
        10px;

      background:
        #ffffff;

      color:
        #111827;

      font-size:
        16px;

      outline:
        none;

      cursor:
        pointer;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    select:hover:not(:disabled) {

      border-color:
        #aab4c3;
    }


    select:focus {

      border-color:
        #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.12);
    }


    select:disabled {

      background:
        #f8fafc;

      color:
        #aeb8c7;

      cursor:
        not-allowed;
    }


    /*
     * ==========================================
     * PO BOQ
     * ==========================================
     */

    .boq-field {

      margin-bottom:
        26px;
    }


    .boq-field label {

      display:
        block;

      margin-bottom:
        9px;

      font-size:
        15px;

      font-weight:
        700;

      color:
        #1e293b;
    }


    .boq-input {

      width:
        100%;

      height:
        54px;

      padding:
        0 15px;

      border:
        1px solid
        #d8dee8;

      border-radius:
        10px;

      background:
        #f1f5f9;

      color:
        #475569;

      font-size:
        16px;

      font-weight:
        600;

      outline:
        none;

      cursor:
        not-allowed;
    }


    .boq-input:disabled {

      opacity:
        1;
    }


    /*
     * ==========================================
     * QUANTITY
     * ==========================================
     */

    .quantity-row {

      display:
        grid;

      grid-template-columns:
        140px 1fr;

      align-items:
        center;

      gap:
        15px;

      margin-bottom:
        30px;
    }


    .quantity-label {

      font-size:
        15px;

      font-weight:
        700;

      color:
        #1e293b;
    }


    .quantity-input {

      width:
        100%;

      height:
        54px;

      padding:
        0 15px;

      border:
        1px solid
        #d8dee8;

      border-radius:
        10px;

      background:
        #ffffff;

      color:
        #111827;

      font-size:
        16px;

      outline:
        none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }


    .quantity-input:focus {

      border-color:
        #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.12);
    }


    .quantity-input.invalid {

      border-color:
        #dc2626;

      box-shadow:
        0 0 0 3px
        rgba(220, 38, 38, 0.10);
    }


    /*
     * ==========================================
     * QUANTITY HINT
     * ==========================================
     */

    .quantity-hint {

      margin-top:
        7px;

      margin-left:
        155px;

      font-size:
        13px;

      color:
        #64748b;
    }


    /*
     * ==========================================
     * SAVE BUTTON
     * ==========================================
     */

    .save-container {

      display:
        flex;

      justify-content:
        flex-end;

      margin-top:
        10px;
    }


    .save-button {

      min-width:
        150px;

      height:
        52px;

      padding:
        0 25px;

      border:
        none;

      border-radius:
        10px;

      background:
        #2563eb;

      color:
        #ffffff;

      font-size:
        15px;

      font-weight:
        700;

      cursor:
        pointer;

      transition:
        background 0.2s ease,
        transform 0.1s ease,
        opacity 0.2s ease;
    }


    .save-button:hover:not(:disabled) {

      background:
        #1d4ed8;
    }


    .save-button:active:not(:disabled) {

      transform:
        translateY(1px);
    }


    .save-button:disabled {

      opacity:
        0.6;

      cursor:
        not-allowed;
    }


    /*
     * ==========================================
     * MESSAGES
     * ==========================================
     */

    .message {

      margin-bottom:
        24px;

      padding:
        13px 15px;

      border-radius:
        9px;

      font-size:
        14px;

      line-height:
        1.5;
    }


    .message.error {

      background:
        #fef2f2;

      color:
        #b91c1c;

      border:
        1px solid
        #fecaca;
    }


    .message.success {

      background:
        #f0fdf4;

      color:
        #15803d;

      border:
        1px solid
        #bbf7d0;
    }


    /*
     * ==========================================
     * SELECTION RESULT
     * ==========================================
     */

    .selection-result {

      margin-top:
        30px;

      padding:
        20px;

      border:
        1px solid
        #e2e8f0;

      border-radius:
        10px;

      background:
        #f8fafc;
    }


    .result-row {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      gap:
        20px;

      padding:
        10px 0;
    }


    .result-row + .result-row {

      border-top:
        1px solid
        #e2e8f0;
    }


    .result-label {

      font-weight:
        700;

      color:
        #334155;
    }


    .result-value {

      text-align:
        right;

      color:
        #0f172a;

      word-break:
        break-word;
    }


    /*
     * ==========================================
     * RESPONSIVE
     * ==========================================
     */

    @media (
      max-width: 700px
    ) {

      .type-options {

        grid-template-columns:
          repeat(2, 1fr);

      }

    }


    @media (
      max-width: 600px
    ) {

      .page {

        padding:
          20px 14px;

      }


      .card {

        padding:
          25px 20px;

        border-radius:
          13px;

      }


      .header h1 {

        font-size:
          26px;

      }


      .header p {

        font-size:
          14px;

      }


      .quantity-row {

        grid-template-columns:
          1fr;

        gap:
          8px;

      }


      .quantity-hint {

        margin-left:
          0;

      }


      .save-container {

        justify-content:
          stretch;

      }


      .save-button {

        width:
          100%;

      }


      .result-row {

        flex-direction:
          column;

        gap:
          4px;

      }


      .result-value {

        text-align:
          left;

      }

    }

  </style>

</head>


<body>


  <main class="page">


    <section class="card">


      <!-- ==========================================
           HEADER
           ========================================== -->

      <div class="header">

        <h1>
          QS Submittals
        </h1>

        <p>
          Select the submittal type, Item Name, Part Number and Quantity.
        </p>

      </div>


      <!-- ==========================================
           SUBMITTAL TYPES
           ========================================== -->

      <div class="type-section">

        <span class="section-label">
          Submittal Type
        </span>


        <div class="type-options">


          <div class="type-option">

            <input
              type="checkbox"
              id="typeMIR"
              class="type-checkbox"
              value="MIR"
            >

            <label
              for="typeMIR"
              class="type-label"
            >
              MIR
            </label>

          </div>


          <div class="type-option">

            <input
              type="checkbox"
              id="typeWIR"
              class="type-checkbox"
              value="WIR"
            >

            <label
              for="typeWIR"
              class="type-label"
            >
              WIR
            </label>

          </div>


          <div class="type-option">

            <input
              type="checkbox"
              id="typeCIR"
              class="type-checkbox"
              value="CIR"
            >

            <label
              for="typeCIR"
              class="type-label"
            >
              CIR
            </label>

          </div>


          <div class="type-option">

            <input
              type="checkbox"
              id="typeHandover"
              class="type-checkbox"
              value="Handover"
            >

            <label
              for="typeHandover"
              class="type-label"
            >
              Handover
            </label>

          </div>


          <div class="type-option">

            <input
              type="checkbox"
              id="typeIPC"
              class="type-checkbox"
              value="IPC"
            >

            <label
              for="typeIPC"
              class="type-label"
            >
              IPC
            </label>

          </div>


        </div>

      </div>


      <!-- ==========================================
           LOADING
           ========================================== -->

      <div
        id="loading"
        class="loading"
      >

        <div class="loading-header">

          <div class="loading-left">

            <div
              id="spinner"
              class="spinner"
            ></div>

            <span id="loadingText">
              Loading database...
            </span>

          </div>


          <div
            id="loadingPercentage"
            class="loading-percentage"
          >
            0%
          </div>

        </div>


        <div class="progress-track">

          <div
            id="progressBar"
            class="progress-bar"
          ></div>

        </div>

      </div>


      <!-- ==========================================
           ERROR MESSAGE
           ========================================== -->

      <div
        id="errorMessage"
        class="message error"
        hidden
      >
      </div>


      <!-- ==========================================
           SUCCESS MESSAGE
           ========================================== -->

      <div
        id="successMessage"
        class="message success"
        hidden
      >
      </div>


      <!-- ==========================================
           ITEM NAME
           ========================================== -->

      <div class="field">

        <label
          for="itemName"
        >
          Item Name
        </label>


        <select
          id="itemName"
          disabled
        >

          <option value="">
            Select Item Name
          </option>

        </select>

      </div>


      <!-- ==========================================
           PART NUMBER
           ========================================== -->

      <div class="field">

        <label
          for="partNumber"
        >
          Part Number
        </label>


        <select
          id="partNumber"
          disabled
        >

          <option value="">
            Select Part Number
          </option>

        </select>

      </div>


      <!-- ==========================================
           PO BOQ
           ========================================== -->

      <div class="boq-field">

        <label
          for="poBoq"
        >
          PO BOQ
        </label>


        <input
          type="text"
          id="poBoq"
          class="boq-input"
          value=""
          placeholder="Select Item Name and Part Number"
          disabled
        >

      </div>


      <!-- ==========================================
           QUANTITY
           ========================================== -->

      <div class="quantity-row">

        <label
          for="quantity"
          class="quantity-label"
        >
          Quantity
        </label>


        <div>

          <input
            type="text"
            id="quantity"
            class="quantity-input"
            inputmode="decimal"
            autocomplete="off"
            placeholder="Enter quantity"
          >


          <div
            id="quantityHint"
            class="quantity-hint"
          >
            Select a Part Number to see the maximum allowed quantity.
          </div>

        </div>

      </div>


      <!-- ==========================================
           SAVE BUTTON
           ========================================== -->

      <div class="save-container">

        <button
          type="button"
          id="saveButton"
          class="save-button"
        >
          Save
        </button>

      </div>


      <!-- ==========================================
           SELECTION RESULT
           ========================================== -->

      <div
        id="selectionResult"
        class="selection-result"
        hidden
      >

        <div class="result-row">

          <span class="result-label">
            Type
          </span>

          <span
            id="selectedType"
            class="result-value"
          >
          </span>

        </div>


        <div class="result-row">

          <span class="result-label">
            Item Name
          </span>

          <span
            id="selectedItemName"
            class="result-value"
          >
          </span>

        </div>


        <div class="result-row">

          <span class="result-label">
            Part Number
          </span>

          <span
            id="selectedPartNumber"
            class="result-value"
          >
          </span>

        </div>


        <div class="result-row">

          <span class="result-label">
            PO BOQ
          </span>

          <span
            id="selectedBoq"
            class="result-value"
          >
          </span>

        </div>


        <div class="result-row">

          <span class="result-label">
            Quantity
          </span>

          <span
            id="selectedQuantity"
            class="result-value"
          >
          </span>

        </div>

      </div>


    </section>


  </main>


  <script>


    /*
     * =========================================================
     * GOOGLE APPS SCRIPT API URL
     * =========================================================
     */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbwmeciYKfJZcM2ZqDAVmzKLTjPtpdGPbklQDTgXtTurCUvCEOKXs3oEGFTpwTxVnykH/exec';


    /*
     * =========================================================
     * APPLICATION DATA
     * =========================================================
     */

    let databaseData = {

      itemNames: [],

      dependentPartNumbers: {}

    };


    /*
     * =========================================================
     * CURRENT BOQ
     * =========================================================
     */

    let currentBoq = null;


    /*
     * =========================================================
     * PROGRESS
     * =========================================================
     */

    let progressValue = 0;

    let progressTimer = null;


    /*
     * =========================================================
     * INITIALIZATION
     * =========================================================
     */

    document.addEventListener(
      'DOMContentLoaded',
      function() {

        initialize();

      }
    );


    /*
     * =========================================================
     * INITIALIZE
     * =========================================================
     */

    function initialize() {

      showLoading(true);

      hideError();

      hideSuccess();

      hideSelectionResult();

      startProgress();


      setupTypeCheckboxes();

      setupQuantityInput();

      setupSaveButton();


      loadDatabaseData();

    }


    /*
     * =========================================================
     * TYPE CHECKBOXES
     *
     * Only ONE checkbox can be selected.
     * =========================================================
     */

    function setupTypeCheckboxes() {

      const checkboxes =
        document.querySelectorAll(
          '.type-checkbox'
        );


      checkboxes.forEach(
        function(checkbox) {

          checkbox.addEventListener(
            'change',
            function() {

              if (
                this.checked
              ) {

                checkboxes.forEach(
                  function(otherCheckbox) {

                    if (
                      otherCheckbox !==
                      checkbox
                    ) {

                      otherCheckbox.checked =
                        false;

                    }

                  }
                );

              }


              hideError();

              hideSuccess();

            }
          );

        }
      );

    }


    /*
     * =========================================================
     * QUANTITY INPUT
     *
     * Allow numbers only.
     *
     * Decimal point is allowed.
     * =========================================================
     */

    function setupQuantityInput() {

      const quantityInput =
        document.getElementById(
          'quantity'
        );


      quantityInput.addEventListener(
        'input',
        function() {

          let value =
            this.value;


          /*
           * Keep digits and decimal point only.
           */

          value =
            value.replace(
              /[^0-9.]/g,
              ''
            );


          /*
           * Keep only the first decimal point.
           */

          const firstDot =
            value.indexOf(
              '.'
            );


          if (
            firstDot !== -1
          ) {

            value =
              value.substring(
                0,
                firstDot + 1
              ) +
              value
                .substring(
                  firstDot + 1
                )
                .replace(
                  /\./g,
                  ''
                );

          }


          this.value =
            value;


          validateQuantityInput();

          hideError();

          hideSuccess();

        }
      );

    }


    /*
     * =========================================================
     * VALIDATE QUANTITY AGAINST PO BOQ
     * =========================================================
     */

    function validateQuantityInput() {

      const quantityInput =
        document.getElementById(
          'quantity'
        );


      const quantity =
        quantityInput.value.trim();


      quantityInput.classList.remove(
        'invalid'
      );


      /*
       * No quantity entered yet.
       */
      if (!quantity) {

        return true;

      }


      /*
       * Basic number validation.
       */
      if (
        !/^\d+(\.\d+)?$/.test(
          quantity
        )
      ) {

        quantityInput.classList.add(
          'invalid'
        );

        return false;

      }


      /*
       * BOQ is not selected yet.
       */
      if (
        currentBoq === null
      ) {

        return true;

      }


      const quantityNumber =
        Number(
          quantity
        );


      /*
       * Quantity cannot exceed BOQ.
       */
      if (
        quantityNumber >
        currentBoq
      ) {

        quantityInput.classList.add(
          'invalid'
        );

        return false;

      }


      return true;

    }


    /*
     * =========================================================
     * SHOW BOQ
     * =========================================================
     */

    function showBoq(
      boq
    ) {

      const boqInput =
        document.getElementById(
          'poBoq'
        );


      const quantityHint =
        document.getElementById(
          'quantityHint'
        );


      /*
       * Reset current BOQ.
       */
      currentBoq =
        null;


      /*
       * No BOQ.
       */
      if (
        boq === undefined ||
        boq === null ||
        String(boq).trim() === ''
      ) {

        boqInput.value =
          'No BOQ available';


        quantityHint.textContent =
          'No BOQ was found for this Part Number.';


        return;

      }


      /*
       * Display original BOQ.
       */
      boqInput.value =
        String(
          boq
        );


      /*
       * Convert BOQ to number.
       *
       * Commas are supported.
       */
      const normalizedBoq =
        String(
          boq
        )
          .replace(
            /,/g,
            ''
          )
          .trim();


      const boqNumber =
        Number(
          normalizedBoq
        );


      if (
        Number.isFinite(
          boqNumber
        ) &&
        boqNumber >= 0
      ) {

        currentBoq =
          boqNumber;


        quantityHint.textContent =
          'Maximum allowed quantity: ' +
          formatNumber(
            boqNumber
          );

      } else {

        quantityHint.textContent =
          'The BOQ value is not a valid number.';

      }


      /*
       * Revalidate quantity.
       */
      validateQuantityInput();

    }


    /*
     * =========================================================
     * RESET BOQ
     * =========================================================
     */

    function resetBoq() {

      currentBoq =
        null;


      const boqInput =
        document.getElementById(
          'poBoq'
        );


      const quantityHint =
        document.getElementById(
          'quantityHint'
        );


      boqInput.value =
        '';


      boqInput.placeholder =
        'Select Item Name and Part Number';


      quantityHint.textContent =
        'Select a Part Number to see the maximum allowed quantity.';


      document
        .getElementById(
          'quantity'
        )
        .classList.remove(
          'invalid'
        );

    }


    /*
     * =========================================================
     * FORMAT NUMBER
     * =========================================================
     */

    function formatNumber(
      number
    ) {

      return Number(
        number
      ).toLocaleString(
        'en-US',
        {
          maximumFractionDigits: 10
        }
      );

    }


    /*
     * =========================================================
     * SAVE BUTTON
     * =========================================================
     */

    function setupSaveButton() {

      document
        .getElementById(
          'saveButton'
        )
        .addEventListener(
          'click',
          handleSave
        );

    }


    /*
     * =========================================================
     * HANDLE SAVE
     * =========================================================
     */

    function handleSave() {

      hideError();

      hideSuccess();


      /*
       * Get selected type.
       */

      const selectedType =
        getSelectedType();


      if (!selectedType) {

        showError(
          'Please select one Submittal Type.'
        );

        return;

      }


      /*
       * Get Item Name.
       */

      const itemNameSelect =
        document.getElementById(
          'itemName'
        );


      const itemName =
        itemNameSelect.value;


      if (!itemName) {

        showError(
          'Please select an Item Name.'
        );

        return;

      }


      /*
       * Get Part Number.
       */

      const partNumberSelect =
        document.getElementById(
          'partNumber'
        );


      const partNumber =
        partNumberSelect.value;


      if (!partNumber) {

        showError(
          'Please select a Part Number.'
        );

        return;

      }


      /*
       * BOQ must exist.
       */

      if (
        currentBoq === null
      ) {

        showError(
          'No valid PO BOQ was found for the selected Part Number.'
        );

        return;

      }


      /*
       * Get Quantity.
       */

      const quantityInput =
        document.getElementById(
          'quantity'
        );


      const quantity =
        quantityInput.value.trim();


      if (!quantity) {

        showError(
          'Please enter Quantity.'
        );

        quantityInput.focus();

        return;

      }


      /*
       * Validate Quantity format.
       */

      if (
        !/^\d+(\.\d+)?$/.test(
          quantity
        )
      ) {

        showError(
          'Quantity must contain numbers only.'
        );

        quantityInput.focus();

        return;

      }


      const quantityNumber =
        Number(
          quantity
        );


      if (
        !Number.isFinite(
          quantityNumber
        ) ||
        quantityNumber <= 0
      ) {

        showError(
          'Quantity must be greater than zero.'
        );

        quantityInput.focus();

        return;

      }


      /*
       * =======================================================
       * IMPORTANT:
       *
       * Quantity cannot be greater than PO BOQ.
       * =======================================================
       */

      if (
        quantityNumber >
        currentBoq
      ) {

        quantityInput.classList.add(
          'invalid'
        );


        showError(
          'Quantity (' +
          formatNumber(
            quantityNumber
          ) +
          ') cannot be greater than PO BOQ (' +
          formatNumber(
            currentBoq
          ) +
          ').'
        );


        quantityInput.focus();

        return;

      }


      /*
       * Send save request.
       */

      saveSubmittal(
        selectedType,
        itemName,
        partNumber,
        quantity
      );

    }


    /*
     * =========================================================
     * GET SELECTED TYPE
     * =========================================================
     */

    function getSelectedType() {

      const selectedCheckbox =
        document.querySelector(
          '.type-checkbox:checked'
        );


      if (
        !selectedCheckbox
      ) {

        return '';

      }


      return selectedCheckbox.value;

    }


    /*
     * =========================================================
     * SAVE SUBMITTAL API REQUEST
     *
     * JSONP is used for GitHub Pages.
     * =========================================================
     */

    function saveSubmittal(
      type,
      itemName,
      partNumber,
      quantity
    ) {

      /*
       * Disable Save button.
       */

      const saveButton =
        document.getElementById(
          'saveButton'
        );


      saveButton.disabled =
        true;


      saveButton.textContent =
        'Saving...';


      /*
       * Create callback name.
       */

      const callbackName =
        'handleSaveResponse_' +
        Date.now();


      /*
       * Create global callback.
       */

      window[callbackName] =
        function(response) {

          try {

            if (
              !response ||
              !response.success
            ) {

              throw new Error(
                response &&
                response.error
                  ? response.error
                  : 'Unable to save the submittal.'
              );

            }


            /*
             * Show success.
             */

            showSuccess(
              'Submittal saved successfully.'
            );


            /*
             * Show saved data.
             */

            document.getElementById(
              'selectedType'
            ).textContent =
              response.data.type;


            document.getElementById(
              'selectedItemName'
            ).textContent =
              response.data.itemName;


            document.getElementById(
              'selectedPartNumber'
            ).textContent =
              response.data.partNumber;


            document.getElementById(
              'selectedBoq'
            ).textContent =
              response.data.boq;


            document.getElementById(
              'selectedQuantity'
            ).textContent =
              response.data.quantity;


            document.getElementById(
              'selectionResult'
            ).hidden =
              false;


            /*
             * Reset form after successful save.
             */

            resetFormAfterSave();


          } catch (error) {

            showError(
              error &&
              error.message
                ? error.message
                : 'Unable to save the submittal.'
            );

          } finally {

            saveButton.disabled =
              false;


            saveButton.textContent =
              'Save';


            cleanupJsonp(
              script,
              callbackName
            );

          }

        };


      /*
       * Create script element.
       */

      const script =
        document.createElement(
          'script'
        );


      /*
       * Build API URL.
       */

      script.src =
        API_URL +
        '?action=saveSubmittal' +
        '&prefix=' +
        encodeURIComponent(
          callbackName
        ) +
        '&type=' +
        encodeURIComponent(
          type
        ) +
        '&itemName=' +
        encodeURIComponent(
          itemName
        ) +
        '&partNumber=' +
        encodeURIComponent(
          partNumber
        ) +
        '&quantity=' +
        encodeURIComponent(
          quantity
        );


      /*
       * Handle API connection error.
       */

      script.onerror =
        function() {

          showError(
            'Unable to connect to the Google Apps Script API.'
          );


          saveButton.disabled =
            false;


          saveButton.textContent =
            'Save';


          cleanupJsonp(
            script,
            callbackName
          );

        };


      /*
       * Add script.
       */

      document.body.appendChild(
        script
      );

    }


    /*
     * =========================================================
     * LOAD DATABASE DATA
     * =========================================================
     */

    function loadDatabaseData() {

      const callbackName =
        'handleDatabaseResponse_' +
        Date.now();


      /*
       * Create global callback.
       */

      window[callbackName] =
        function(response) {

          try {

            if (
              !response ||
              !response.success
            ) {

              throw new Error(
                response &&
                response.error
                  ? response.error
                  : 'The API returned an error.'
              );

            }


            databaseData =
              response.data || {

                itemNames: [],

                dependentPartNumbers: {}

              };


            populateItemNames();


            completeProgress();


            document.getElementById(
              'loadingText'
            ).textContent =
              'Database loaded successfully.';


          } catch (error) {

            completeProgress();


            showError(
              error &&
              error.message
                ? error.message
                : 'Unable to load database data.'
            );

          } finally {

            setTimeout(
              function() {

                showLoading(false);

              },
              400
            );


            cleanupJsonp(
              script,
              callbackName
            );

          }

        };


      /*
       * Create script.
       */

      const script =
        document.createElement(
          'script'
        );


      /*
       * Build URL.
       */

      script.src =
        API_URL +
        '?action=getDatabaseData' +
        '&prefix=' +
        encodeURIComponent(
          callbackName
        );


      /*
       * Connection error.
       */

      script.onerror =
        function() {

          if (progressTimer) {

            clearInterval(
              progressTimer
            );

            progressTimer =
              null;

          }


          showLoading(false);


          showError(
            'Unable to connect to the Google Apps Script API.'
          );


          cleanupJsonp(
            script,
            callbackName
          );

        };


      document.body.appendChild(
        script
      );

    }


    /*
     * =========================================================
     * POPULATE ITEM NAME
     * =========================================================
     */

    function populateItemNames() {

      const itemNameSelect =
        document.getElementById(
          'itemName'
        );


      const partNumberSelect =
        document.getElementById(
          'partNumber'
        );


      clearSelect(
        itemNameSelect,
        'Select Item Name'
      );


      clearSelect(
        partNumberSelect,
        'Select Part Number'
      );


      resetBoq();


      const itemNames =
        databaseData.itemNames || [];


      itemNames.forEach(
        function(itemName) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            itemName;


          option.textContent =
            itemName;


          itemNameSelect.appendChild(
            option
          );

        }
      );


      itemNameSelect.disabled =
        itemNames.length === 0;


      partNumberSelect.disabled =
        true;


      itemNameSelect.onchange =
        handleItemNameChange;


      partNumberSelect.onchange =
        handlePartNumberChange;

    }


    /*
     * =========================================================
     * ITEM NAME CHANGE
     * =========================================================
     */

    function handleItemNameChange() {

      const itemNameSelect =
        document.getElementById(
          'itemName'
        );


      const partNumberSelect =
        document.getElementById(
          'partNumber'
        );


      const selectedItemName =
        itemNameSelect.value;


      clearSelect(
        partNumberSelect,
        'Select Part Number'
      );


      resetBoq();

      hideSelectionResult();

      hideError();

      hideSuccess();


      /*
       * Clear quantity.
       */
      document.getElementById(
        'quantity'
      ).value =
        '';


      if (
        !selectedItemName
      ) {

        partNumberSelect.disabled =
          true;

        return;

      }


      const partNumbers =
        databaseData
          .dependentPartNumbers[
            selectedItemName
          ] || [];


      partNumbers.forEach(
        function(partNumber) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            partNumber;


          option.textContent =
            partNumber;


          partNumberSelect.appendChild(
            option
          );

        }
      );


      partNumberSelect.disabled =
        partNumbers.length === 0;

    }


    /*
     * =========================================================
     * PART NUMBER CHANGE
     * =========================================================
     */

    function handlePartNumberChange() {

      const itemNameSelect =
        document.getElementById(
          'itemName'
        );


      const partNumberSelect =
        document.getElementById(
          'partNumber'
        );


      const selectedItemName =
        itemNameSelect.value;


      const selectedPartNumber =
        partNumberSelect.value;


      /*
       * Reset first.
       */
      resetBoq();


      hideSelectionResult();

      hideError();

      hideSuccess();


      /*
       * Clear Quantity when Part Number changes.
       */
      document.getElementById(
        'quantity'
      ).value =
        '';


      if (
        !selectedItemName ||
        !selectedPartNumber
      ) {

        return;

      }


      /*
       * Find the selected Part Number
       * in the current Item Name.
       *
       * We need BOQ and the other details.
       *
       * The original getDatabaseData API only returns
       * Part Number lists, so we request the details
       * from the same API using saveSubmittal validation
       * is NOT suitable here.
       *
       * Therefore we use the lookup API action below.
       */

      loadPartNumberDetails(
        selectedPartNumber
      );

    }


    /*
     * =========================================================
     * LOAD PART NUMBER DETAILS
     * =========================================================
     */

    function loadPartNumberDetails(
      partNumber
    ) {

      const callbackName =
        'handlePartNumberDetails_' +
        Date.now();


      window[callbackName] =
        function(response) {

          try {

            if (
              !response ||
              !response.success
            ) {

              throw new Error(
                response &&
                response.error
                  ? response.error
                  : 'Unable to load Part Number details.'
              );

            }


            showBoq(
              response.data.boq
            );


          } catch (error) {

            resetBoq();


            showError(
              error &&
              error.message
                ? error.message
                : 'Unable to load Part Number details.'
            );

          } finally {

            cleanupJsonp(
              script,
              callbackName
            );

          }

        };


      const script =
        document.createElement(
          'script'
        );


      script.src =
        API_URL +
        '?action=getPartNumberDetails' +
        '&prefix=' +
        encodeURIComponent(
          callbackName
        ) +
        '&partNumber=' +
        encodeURIComponent(
          partNumber
        );


      script.onerror =
        function() {

          resetBoq();


          showError(
            'Unable to connect to the Google Apps Script API.'
          );


          cleanupJsonp(
            script,
            callbackName
          );

        };


      document.body.appendChild(
        script
      );

    }


    /*
     * =========================================================
     * RESET AFTER SAVE
     * =========================================================
     */

    function resetFormAfterSave() {

      /*
       * Uncheck all types.
       */

      document
        .querySelectorAll(
          '.type-checkbox'
        )
        .forEach(
          function(checkbox) {

            checkbox.checked =
              false;

          }
        );


      /*
       * Reset Item Name.
       */

      const itemNameSelect =
        document.getElementById(
          'itemName'
        );


      itemNameSelect.value =
        '';


      /*
       * Reset Part Number.
       */

      const partNumberSelect =
        document.getElementById(
          'partNumber'
        );


      clearSelect(
        partNumberSelect,
        'Select Part Number'
      );


      partNumberSelect.disabled =
        true;


      /*
       * Reset BOQ.
       */

      resetBoq();


      /*
       * Reset Quantity.
       */

      document.getElementById(
        'quantity'
      ).value =
        '';

    }


    /*
     * =========================================================
     * CLEAR SELECT
     * =========================================================
     */

    function clearSelect(
      selectElement,
      placeholder
    ) {

      selectElement.innerHTML =
        '';


      const option =
        document.createElement(
          'option'
        );


      option.value =
        '';


      option.textContent =
        placeholder;


      selectElement.appendChild(
        option
      );

    }


    /*
     * =========================================================
     * PROGRESS
     * =========================================================
     */

    function startProgress() {

      progressValue =
        0;


      updateProgress(
        progressValue
      );


      if (progressTimer) {

        clearInterval(
          progressTimer
        );

      }


      progressTimer =
        setInterval(
          function() {

            if (
              progressValue < 60
            ) {

              progressValue +=
                2;

            } else if (
              progressValue < 80
            ) {

              progressValue +=
                1;

            } else if (
              progressValue < 90
            ) {

              progressValue +=
                0.5;

            }


            if (
              progressValue > 90
            ) {

              progressValue =
                90;

            }


            updateProgress(
              progressValue
            );

          },
          150
        );

    }


    /*
     * =========================================================
     * COMPLETE PROGRESS
     * =========================================================
     */

    function completeProgress() {

      if (progressTimer) {

        clearInterval(
          progressTimer
        );

        progressTimer =
          null;

      }


      progressValue =
        100;


      updateProgress(
        progressValue
      );

    }


    /*
     * =========================================================
     * UPDATE PROGRESS
     * =========================================================
     */

    function updateProgress(
      value
    ) {

      const percentage =
        Math.round(
          value
        );


      document.getElementById(
        'progressBar'
      ).style.width =
        percentage +
        '%';


      document.getElementById(
        'loadingPercentage'
      ).textContent =
        percentage +
        '%';

    }


    /*
     * =========================================================
     * LOADING
     * =========================================================
     */

    function showLoading(
      show
    ) {

      document.getElementById(
        'loading'
      ).hidden =
        !show;

    }


    /*
     * =========================================================
     * ERROR
     * =========================================================
     */

    function showError(
      message
    ) {

      const errorElement =
        document.getElementById(
          'errorMessage'
        );


      errorElement.textContent =
        message;


      errorElement.hidden =
        false;

    }


    /*
     * =========================================================
     * HIDE ERROR
     * =========================================================
     */

    function hideError() {

      const errorElement =
        document.getElementById(
          'errorMessage'
        );


      errorElement.textContent =
        '';


      errorElement.hidden =
        true;

    }


    /*
     * =========================================================
     * SUCCESS
     * =========================================================
     */

    function showSuccess(
      message
    ) {

      const successElement =
        document.getElementById(
          'successMessage'
        );


      successElement.textContent =
        message;


      successElement.hidden =
        false;

    }


    /*
     * =========================================================
     * HIDE SUCCESS
     * =========================================================
     */

    function hideSuccess() {

      const successElement =
        document.getElementById(
          'successMessage'
        );


      successElement.textContent =
        '';


      successElement.hidden =
        true;

    }


    /*
     * =========================================================
     * HIDE SELECTION RESULT
     * =========================================================
     */

    function hideSelectionResult() {

      document.getElementById(
        'selectionResult'
      ).hidden =
        true;

    }


    /*
     * =========================================================
     * CLEAN JSONP
     * =========================================================
     */

    function cleanupJsonp(
      script,
      callbackName
    ) {

      if (
        script &&
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }


      try {

        delete window[
          callbackName
        ];

      } catch (error) {

        window[
          callbackName
        ] =
          undefined;

      }

    }


  </script>


</body>

</html>
