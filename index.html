<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Item Selection</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
    }


    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f7fb;

      color: #1f2937;
    }


    .page {

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      padding: 50px 20px;
    }


    .card {

      width: 100%;

      max-width: 620px;

      background: #ffffff;

      border-radius: 16px;

      padding: 32px;

      box-shadow:
        0 10px 35px
        rgba(0, 0, 0, 0.08);
    }


    .header {

      margin-bottom: 30px;
    }


    .header h1 {

      margin: 0 0 8px 0;

      font-size: 28px;

      line-height: 1.2;

      color: #111827;
    }


    .header p {

      margin: 0;

      font-size: 14px;

      line-height: 1.6;

      color: #6b7280;
    }


    .field {

      margin-bottom: 24px;
    }


    .field label {

      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 700;

      color: #374151;
    }


    select {

      width: 100%;

      height: 50px;

      padding: 0 14px;

      border:
        1px solid
        #d1d5db;

      border-radius: 9px;

      background: #ffffff;

      color: #111827;

      font-size: 15px;

      outline: none;

      cursor: pointer;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    select:hover:not(:disabled) {

      border-color:
        #9ca3af;
    }


    select:focus {

      border-color:
        #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.12);
    }


    select:disabled {

      background:
        #f3f4f6;

      color:
        #9ca3af;

      cursor:
        not-allowed;
    }


    .loading {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 24px;

      padding: 12px 14px;

      border-radius: 8px;

      background:
        #f8fafc;

      color:
        #6b7280;

      font-size: 14px;
    }


    .spinner {

      width: 18px;

      height: 18px;

      border:
        2px solid
        #e5e7eb;

      border-top-color:
        #2563eb;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    .message {

      margin-bottom: 24px;

      padding: 12px 14px;

      border-radius: 8px;

      font-size: 14px;

      line-height: 1.5;
    }


    .message.error {

      background:
        #fef2f2;

      color:
        #b91c1c;

      border:
        1px solid
        #fecaca;
    }


    .selection-result {

      margin-top: 28px;

      padding: 18px;

      border:
        1px solid
        #e5e7eb;

      border-radius: 10px;

      background:
        #f8fafc;
    }


    .result-row {

      display: flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      gap: 20px;

      padding: 9px 0;
    }


    .result-row + .result-row {

      border-top:
        1px solid
        #e5e7eb;
    }


    .result-label {

      font-weight: 700;

      color:
        #374151;
    }


    .result-value {

      text-align:
        right;

      color:
        #111827;

      word-break:
        break-word;
    }


    @media (
      max-width: 600px
    ) {

      .page {

        padding:
          20px 14px;

      }


      .card {

        padding:
          24px 20px;

        border-radius:
          12px;

      }


      .header h1 {

        font-size:
          24px;

      }


      .result-row {

        flex-direction:
          column;

        gap:
          4px;

      }


      .result-value {

        text-align:
          left;

      }

    }

  </style>

</head>


<body>


  <main class="page">


    <section class="card">


      <div class="header">

        <h1>
          Item Selection
        </h1>

        <p>
          Select an Item Name to load its related Part Numbers.
        </p>

      </div>


      <!-- Loading -->

      <div
        id="loading"
        class="loading"
      >

        <div class="spinner"></div>

        <span>
          Loading database...
        </span>

      </div>


      <!-- Error -->

      <div
        id="errorMessage"
        class="message error"
        hidden
      >
      </div>


      <!-- Item Name -->

      <div class="field">

        <label
          for="itemName"
        >
          Item Name
        </label>


        <select
          id="itemName"
          disabled
        >

          <option value="">
            Select Item Name
          </option>

        </select>

      </div>


      <!-- Part Number -->

      <div class="field">

        <label
          for="partNumber"
        >
          Part Number
        </label>


        <select
          id="partNumber"
          disabled
        >

          <option value="">
            Select Part Number
          </option>

        </select>

      </div>


      <!-- Selection Result -->

      <div
        id="selectionResult"
        class="selection-result"
        hidden
      >

        <div class="result-row">

          <span class="result-label">
            Item Name
          </span>

          <span
            id="selectedItemName"
            class="result-value"
          >
          </span>

        </div>


        <div class="result-row">

          <span class="result-label">
            Part Number
          </span>

          <span
            id="selectedPartNumber"
            class="result-value"
          >
          </span>

        </div>

      </div>


    </section>


  </main>


  <script>


    /*
     * =========================================================
     * GOOGLE APPS SCRIPT API URL
     * =========================================================
     *
     * The API URL is intentionally stored directly
     * inside this index.html file.
     */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbzGs7d6uK3lL0_aLvDsl9NxBHqyaHEXidR4WGYVGpXOJHy6npD1xeIy8IVi9hfRBWWQLQ/exec';


    /*
     * =========================================================
     * APPLICATION DATA
     * =========================================================
     */

    let databaseData = {

      itemNames: [],

      dependentPartNumbers: {}

    };


    /*
     * =========================================================
     * INITIALIZATION
     * =========================================================
     */

    document.addEventListener(
      'DOMContentLoaded',
      function() {

        initialize();

      }
    );


    /*
     * =========================================================
     * INITIALIZE APPLICATION
     * =========================================================
     */

    function initialize() {

      showLoading(true);

      hideError();

      hideSelectionResult();


      loadDatabaseData();

    }


    /*
     * =========================================================
     * LOAD DATABASE DATA
     *
     * JSONP is used so the GitHub Pages page can request
     * data from Google Apps Script.
     * =========================================================
     */

    function loadDatabaseData() {


      /*
       * Create a unique callback name.
       */

      const callbackName =
        'handleDatabaseResponse_' +
        Date.now();


      /*
       * Create global callback function.
       */

      window[callbackName] =
        function(response) {

          try {

            if (
              !response ||
              !response.success
            ) {

              throw new Error(
                response &&
                response.error
                  ? response.error
                  : 'The API returned an error.'
              );

            }


            databaseData =
              response.data || {

                itemNames: [],

                dependentPartNumbers: {}

              };


            populateItemNames();


          } catch (error) {

            showError(
              error &&
              error.message
                ? error.message
                : 'Unable to load database data.'
            );

          } finally {

            showLoading(false);

            cleanupJsonp(
              script,
              callbackName
            );

          }

        };


      /*
       * Create script element.
       */

      const script =
        document.createElement(
          'script'
        );


      /*
       * Add JSONP parameters.
       */

      script.src =
        API_URL +
        '?action=getDatabaseData' +
        '&prefix=' +
        encodeURIComponent(
          callbackName
        );


      /*
       * Handle network/script errors.
       */

      script.onerror =
        function() {

          showLoading(false);

          showError(
            'Unable to connect to the Google Apps Script API.'
          );


          cleanupJsonp(
            script,
            callbackName
          );

        };


      /*
       * Add script to page.
       */

      document.body.appendChild(
        script
      );

    }


    /*
     * =========================================================
     * CLEAN JSONP RESOURCES
     * =========================================================
     */

    function cleanupJsonp(
      script,
      callbackName
    ) {

      if (
        script &&
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }


      try {

        delete window[
          callbackName
        ];

      } catch (error) {

        window[
          callbackName
        ] = undefined;

      }

    }


    /*
     * =========================================================
     * POPULATE ITEM NAME DROPDOWN
     * =========================================================
     */

    function populateItemNames() {

      const itemNameSelect =
        document.getElementById(
          'itemName'
        );


      const partNumberSelect =
        document.getElementById(
          'partNumber'
        );


      clearSelect(
        itemNameSelect,
        'Select Item Name'
      );


      clearSelect(
        partNumberSelect,
        'Select Part Number'
      );


      const itemNames =
        databaseData.itemNames || [];


      itemNames.forEach(
        function(itemName) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            itemName;


          option.textContent =
            itemName;


          itemNameSelect.appendChild(
            option
          );

        }
      );


      itemNameSelect.disabled =
        itemNames.length === 0;


      partNumberSelect.disabled =
        true;


      itemNameSelect.onchange =
        handleItemNameChange;


      partNumberSelect.onchange =
        handlePartNumberChange;

    }


    /*
     * =========================================================
     * ITEM NAME CHANGE
     *
     * Item Name
     *      ↓
     * Part Number
     * =========================================================
     */

    function handleItemNameChange() {

      const itemNameSelect =
        document.getElementById(
          'itemName'
        );


      const partNumberSelect =
        document.getElementById(
          'partNumber'
        );


      const selectedItemName =
        itemNameSelect.value;


      clearSelect(
        partNumberSelect,
        'Select Part Number'
      );


      hideSelectionResult();


      if (!selectedItemName) {

        partNumberSelect.disabled =
          true;

        return;

      }


      const partNumbers =
        databaseData
          .dependentPartNumbers[
            selectedItemName
          ] || [];


      partNumbers.forEach(
        function(partNumber) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            partNumber;


          option.textContent =
            partNumber;


          partNumberSelect.appendChild(
            option
          );

        }
      );


      partNumberSelect.disabled =
        partNumbers.length === 0;

    }


    /*
     * =========================================================
     * PART NUMBER CHANGE
     * =========================================================
     */

    function handlePartNumberChange() {

      const itemNameSelect =
        document.getElementById(
          'itemName'
        );


      const partNumberSelect =
        document.getElementById(
          'partNumber'
        );


      const selectedItemName =
        itemNameSelect.value;


      const selectedPartNumber =
        partNumberSelect.value;


      if (
        !selectedItemName ||
        !selectedPartNumber
      ) {

        hideSelectionResult();

        return;

      }


      document.getElementById(
        'selectedItemName'
      ).textContent =
        selectedItemName;


      document.getElementById(
        'selectedPartNumber'
      ).textContent =
        selectedPartNumber;


      document.getElementById(
        'selectionResult'
      ).hidden =
        false;

    }


    /*
     * =========================================================
     * CLEAR SELECT
     * =========================================================
     */

    function clearSelect(
      selectElement,
      placeholder
    ) {

      selectElement.innerHTML =
        '';


      const option =
        document.createElement(
          'option'
        );


      option.value =
        '';


      option.textContent =
        placeholder;


      selectElement.appendChild(
        option
      );

    }


    /*
     * =========================================================
     * LOADING
     * =========================================================
     */

    function showLoading(show) {

      document.getElementById(
        'loading'
      ).hidden =
        !show;

    }


    /*
     * =========================================================
     * ERROR
     * =========================================================
     */

    function showError(message) {

      const errorElement =
        document.getElementById(
          'errorMessage'
        );


      errorElement.textContent =
        message;


      errorElement.hidden =
        false;

    }


    /*
     * =========================================================
     * HIDE ERROR
     * =========================================================
     */

    function hideError() {

      const errorElement =
        document.getElementById(
          'errorMessage'
        );


      errorElement.textContent =
        '';


      errorElement.hidden =
        true;

    }


    /*
     * =========================================================
     * HIDE RESULT
     * =========================================================
     */

    function hideSelectionResult() {

      document.getElementById(
        'selectionResult'
      ).hidden =
        true;

    }


  </script>


</body>

</html>
